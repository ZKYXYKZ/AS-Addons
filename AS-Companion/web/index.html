<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AS Companion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">AS Companion</div>
  <div class="row right">
    <a class="coffee" href="https://www.buymeacoffee.com/zkyxykz" target="_blank" rel="noopener"><img src="img/buymeacoffee.png" alt="Buy me a coffee" width="128" height="36"></a>
    <button id="launchBtn" class="primary"></button>
  </div>
</header>
<div id="status" class="status"></div>
<nav id="pages" class="pages"></nav>
<main>
  <section id="page-builds">
    <div class="toolbar">
      <div class="row">
        <select id="classSel"></select>
        <select id="buildSel"></select>
        <button id="newBtn"></button>
        <button id="dupBtn"></button>
        <button id="renBtn"></button>
        <button id="delBtn"></button>
      </div>
      <div class="row right">
        <button id="impBtn"></button>
        <button id="expBtn"></button>
      </div>
    </div>
    <nav id="tabs"></nav>
    <section id="tab-build"></section>
    <section id="tab-rules"></section>
  </section>
  <section id="page-stats"></section>
  <section id="page-addons"></section>
  <section id="page-options"></section>
</main>
<footer>Développé par <a href="https://x.com/zkyxykz" target="_blank" rel="noopener">ZKYXYKZ</a></footer>
<div id="tip" class="tip"></div>
<div id="modal" class="modal hidden">
  <div class="box">
    <div id="modalTitle"></div>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="row right">
      <button id="modalOk" class="primary"></button>
      <button id="modalClose"></button>
    </div>
  </div>
</div>
<script src="stats.js"></script>
<script src="addons.js"></script>
<script src="app.js"></script>
</body>
</html>
