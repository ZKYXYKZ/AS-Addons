name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build ASCompanion.exe
        run: node tools/build-companion.js
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/AS-Addons | Out-Null
          Copy-Item -Recurse SurvivorsBuilds, SurvivorsUI, SurvivorsGuardians dist/AS-Addons/
          Compress-Archive -Path dist/AS-Addons/* -DestinationPath dist/AS-Addons.zip
          Get-FileHash dist/ASCompanion.exe, dist/AS-Addons.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: as-companion
          path: |
            dist/ASCompanion.exe
            dist/AS-Addons.zip
            dist/SHA256SUMS.txt
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ASCompanion.exe
            dist/AS-Addons.zip
            dist/SHA256SUMS.txt
