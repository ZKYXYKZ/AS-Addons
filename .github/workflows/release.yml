name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Lua
        run: node tools/check-lua.js
      - name: Build ASCompanion.exe
        run: node tools/build-companion.js
      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace "^v", ""
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0" }
          $addons = "SurvivorsUI", "SurvivorsBuilds", "SurvivorsGuardians"
          $pkg = "dist/pkg"
          New-Item -ItemType Directory "$pkg/benilla-config/AddOns" -Force | Out-Null
          Copy-Item dist/ASCompanion.exe $pkg/
          $manifest = @()
          foreach ($a in $addons) {
            Copy-Item -Recurse $a "$pkg/benilla-config/AddOns/"
            $toc = "$pkg/benilla-config/AddOns/$a/$a.toc"
            $last = git log -1 --format=%H -- $a
            $tag = git tag --contains $last --sort=v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            $av = if ($tag) { $tag -replace "^v", "" } else { $version }
            (Get-Content $toc) -replace "^## Version: .*", "## Version: $av" | Set-Content $toc
            $title = ((Get-Content $toc | Select-String "^## Title: (.*)").Matches[0].Groups[1].Value)
            $notes = ((Get-Content $toc | Select-String "^## Notes: (.*)").Matches[0].Groups[1].Value)
            Compress-Archive -Path "$pkg/benilla-config/AddOns/$a" -DestinationPath "dist/$a.zip"
            $notesFr = ((Get-Content $toc | Select-String "^## Notes-frFR: (.*)").Matches[0].Groups[1].Value)
            $manifest += [ordered]@{ name = $a; title = $title; notes = $notes; notesFr = $notesFr; version = $av; file = "$a.zip" }
          }
          ConvertTo-Json @($manifest) | Set-Content dist/addons.json
          Compress-Archive -Path "$pkg/*" -DestinationPath dist/AzerothSurvivors-Addons.zip
          $files = @("dist/ASCompanion.exe", "dist/AzerothSurvivors-Addons.zip", "dist/addons.json") + ($addons | ForEach-Object { "dist/$_.zip" })
          Get-FileHash $files -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: as-companion
          path: |
            dist/ASCompanion.exe
            dist/AzerothSurvivors-Addons.zip
            dist/Survivors*.zip
            dist/addons.json
            dist/SHA256SUMS.txt
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ASCompanion.exe
            dist/AzerothSurvivors-Addons.zip
            dist/Survivors*.zip
            dist/addons.json
            dist/SHA256SUMS.txt
