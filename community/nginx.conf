# as-stats.zkysolutions.com : statistiques communautaires Azeroth Survivors, process PM2 « as-stats » sur le port 3040.

limit_req_zone $binary_remote_addr zone=asstats_post:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=asstats_get:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name as-stats.zkysolutions.com;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://as-stats.zkysolutions.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name as-stats.zkysolutions.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/as-stats.zkysolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/as-stats.zkysolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;
    access_log off;
    error_log /var/log/nginx/as-stats.error.log;

    gzip on;
    gzip_types application/json text/html;

    location = /api/runs {
        limit_req zone=asstats_post burst=10 nodelay;
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_req zone=asstats_get burst=40 nodelay;
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
